<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Xtn 站点监控" />
    <meta name="theme-color" content="#111318" />
    <title>服务状态</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23111318'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%234cc38a'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./style.css" />
    <script src="./config.js"></script>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="wrap topbar-inner">
          <div class="brand">
            <span class="brand-dot" id="brandDot"></span>
            <h1 id="siteName">服务状态</h1>
          </div>
          <div class="topbar-right">
            <nav class="navi" id="navi"></nav>
            <button class="icon-btn" id="themeBtn" type="button" title="切换主题" aria-label="切换主题"></button>
            <button class="icon-btn menu-btn" id="menuBtn" type="button" title="菜单" aria-label="菜单" aria-expanded="false">
              <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>
            </button>
          </div>
        </div>
        <div class="mobile-menu" id="mobileMenu" hidden>
          <nav class="mobile-navi" id="mobileNavi"></nav>
          <div class="mobile-actions">
            <button class="mobile-action" id="mBadgeBtn" type="button">状态徽章</button>
            <button class="mobile-action" id="mJsonBtn" type="button">View JSON</button>
          </div>
        </div>
      </header>

      <main class="wrap">
        <section id="bannerSlot"></section>

        <section class="toolbar" id="toolbar">
          <div class="seg" id="periodSeg" role="group" aria-label="时间范围"></div>
          <div class="toolbar-actions">
            <span class="updated" id="updated"></span>
            <button class="ghost-btn" id="groupBtn" type="button" title="切换分组展示"></button>
            <button class="ghost-btn" id="refreshBtn" type="button" title="刷新">
              <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4z"/></svg>
              <span>刷新</span>
            </button>
          </div>
        </section>

        <section id="summarySlot"></section>
        <section id="listSlot" class="cards"></section>
        <section id="timelineSlot"></section>
      </main>

      <footer class="footer wrap">
        <div class="refresh-hint" id="refreshHint"></div>
        <div class="footer-links">
          <button class="text-btn" id="badgeBtn" type="button">状态徽章</button>
          <button class="text-btn" id="jsonBtn" type="button">View JSON</button>
        </div>
      </footer>
    </div>

    <div class="global-loader" id="globalLoader" hidden>
      <div class="global-loader-box">
        <div class="xtn-loader" role="status" aria-label="正在获取数据">
          <svg height="0" width="0" viewBox="0 0 64 64" class="xtn-absolute" aria-hidden="true">
            <defs xmlns="http://www.w3.org/2000/svg">
              <linearGradient gradientUnits="userSpaceOnUse" y2="2" x2="0" y1="62" x1="0" id="xtn-b">
                <stop stop-color="#973BED"></stop>
                <stop stop-color="#007CFF" offset="1"></stop>
              </linearGradient>
              <linearGradient gradientUnits="userSpaceOnUse" y2="0" x2="0" y1="64" x1="0" id="xtn-c">
                <stop stop-color="#FFC800"></stop>
                <stop stop-color="#F0F" offset="1"></stop>
                <animateTransform repeatCount="indefinite" keySplines=".42,0,.58,1;.42,0,.58,1;.42,0,.58,1;.42,0,.58,1;.42,0,.58,1;.42,0,.58,1;.42,0,.58,1;.42,0,.58,1" keyTimes="0; 0.125; 0.25; 0.375; 0.5; 0.625; 0.75; 0.875; 1" dur="8s" values="0 32 32;-270 32 32;-270 32 32;-540 32 32;-540 32 32;-810 32 32;-810 32 32;-1080 32 32;-1080 32 32" type="rotate" attributeName="gradientTransform"></animateTransform>
              </linearGradient>
              <linearGradient gradientUnits="userSpaceOnUse" y2="2" x2="0" y1="62" x1="0" id="xtn-d">
                <stop stop-color="#00E0ED"></stop>
                <stop stop-color="#00DA72" offset="1"></stop>
              </linearGradient>
            </defs>
          </svg>
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 64 64" width="48" height="48" class="xtn-inline">
            <path stroke-linejoin="round" stroke-linecap="round" stroke-width="7" stroke="url(#xtn-b)" d="M14 14 L50 50 M50 14 L14 50" class="xtn-dash" pathLength="360"></path>
          </svg>
          <div class="xtn-gap"></div>
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 64 64" width="48" height="48" class="xtn-inline">
            <path stroke-linejoin="round" stroke-linecap="round" stroke-width="7" stroke="url(#xtn-c)" d="M11 14 L53 14 M32 14 L32 53" class="xtn-dash" pathLength="360"></path>
          </svg>
          <div class="xtn-gap"></div>
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 64 64" width="48" height="48" class="xtn-inline">
            <path stroke-linejoin="round" stroke-linecap="round" stroke-width="7" stroke="url(#xtn-d)" d="M14 53 L14 11 L50 53 L50 11" class="xtn-dash" pathLength="360"></path>
          </svg>
        </div>
        <div class="global-loader-text">正在获取数据</div>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="modal-mask" id="modalMask" hidden>
      <div class="modal panel" role="dialog" aria-modal="true">
        <div class="modal-head">
          <h2 id="modalTitle">标题</h2>
          <button class="icon-btn" id="modalClose" type="button" aria-label="关闭">×</button>
        </div>
        <div class="modal-body" id="modalBody"></div>
      </div>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
