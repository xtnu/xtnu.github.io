<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - 页面未找到</title>
    <link rel="icon" href="./static/img/favicon.ico">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --text-primary: #1d1d1f;
            --text-secondary: #6e6e73;
            --bg: #ffffff;
            --bg-secondary: #f5f5f7;
            --border: #d2d2d7;
            --accent: #007aff;
            --accent-hover: #0066d6;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --text-primary: #f5f5f7;
                --text-secondary: #a1a1a6;
                --bg: #000000;
                --bg-secondary: #1d1d1f;
                --border: #38383a;
                --accent: #0a84ff;
                --accent-hover: #409cff;
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 24px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .container {
            text-align: center;
            max-width: 520px;
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .error-code {
            font-size: 120px;
            font-weight: 700;
            letter-spacing: -0.04em;
            line-height: 1;
            margin-bottom: 24px;
            background: linear-gradient(180deg, var(--text-primary) 0%, var(--text-secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .title {
            font-size: 28px;
            font-weight: 600;
            letter-spacing: -0.01em;
            margin-bottom: 12px;
        }

        .message {
            font-size: 17px;
            font-weight: 400;
            color: var(--text-secondary);
            line-height: 1.5;
            margin-bottom: 40px;
        }

        .actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 28px;
            font-size: 17px;
            font-weight: 500;
            border-radius: 980px;
            text-decoration: none;
            transition: all 0.2s ease;
            cursor: pointer;
            border: none;
            font-family: inherit;
        }

        .btn-primary {
            background: var(--accent);
            color: #ffffff;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--bg-secondary);
        }

        @media (max-width: 480px) {
            .error-code {
                font-size: 88px;
            }

            .title {
                font-size: 22px;
            }

            .message {
                font-size: 15px;
            }

            .actions {
                flex-direction: column;
                align-items: stretch;
            }

            .btn {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-code">404</div>
        <h1 class="title">页面未找到</h1>
        <p class="message">你访问的页面可能已被移除、重命名，或暂时不可用。</p>
        <div class="actions">
            <a href="/" class="btn btn-primary" onclick="playClickSound()">返回首页</a>
            <a href="javascript:history.back()" class="btn btn-secondary" onclick="playClickSound()">返回上一页</a>
        </div>
    </div>

    <script>
        const clickSound = new Audio('./static/soundeffects/click.mp3');

        function playClickSound() {
            clickSound.currentTime = 0;
            clickSound.play().catch(e => console.log('Audio playback prevented:', e));
        }
    </script>
</body>
</html>
